<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Turbo Losowanie</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
</head>
<body>
    <div id="game-container">
        <!-- Niezależna nakładka HTML na nazwy piłeczek w prawym górnym rogu -->
        <div id="names-overlay"></div>
        
        <!-- NOWE: Elegancka prowadnica (popover) do edycji klikniętej strefy -->
        <div id="zone-editor-popover" class="hidden">
            <div class="popover-arrow"></div>
            <div class="popover-header">Edytuj strefę</div>
            <input type="text" id="ze-name" placeholder="Nazwa strefy">
            <div class="ze-row">
                <input type="color" id="ze-color" title="Kolor strefy">
                <input type="number" id="ze-start" min="1" max="1000" title="Dołek początkowy">
                <span> - </span>
                <input type="number" id="ze-end" min="1" max="1000" title="Dołek końcowy">
            </div>
            <div class="ze-actions">
                <button id="ze-save" class="primary-btn">Zapisz / Zamknij</button>
                <button id="ze-delete" class="danger-btn">Usuń</button>
            </div>
        </div>
    </div>
    
    <div id="ui-panel">
        <h2>Ustawienia Symulacji</h2>
        
        <div class="control-group">
            <label for="ballCount">Ilość piłeczek:</label>
            <input type="number" id="ballCount" value="100" min="1" max="1000">
        </div>

        <div class="control-group">
            <label for="holeCount">Ilość dołków:</label>
            <input type="number" id="holeCount" value="100" min="1" max="1000">
        </div>
        
        <div class="control-group">
            <label for="ballsPerHole">Pojemność dołka (ilość piłek na dołek):</label>
            <input type="number" id="ballsPerHole" value="1" min="1" max="100">
        </div>

        <div class="control-group">
            <label for="ballNames">Nazwy piłeczek (każda w nowej linii):</label>
            <textarea id="ballNames" rows="5" placeholder="np.&#10;Mściwój&#10;Kunegunda&#10;Kurwiklides"></textarea>
        </div>
        
        <button id="btn-restart" class="primary-btn">Uruchom symulację</button>

        <hr>

        <h2>Ustawienia Magicznych Dołków</h2>
        <div class="control-group">
            <label class="checkbox-label">
                <input type="checkbox" id="cb-magnet" checked> Włącz przyciąganie dołków
            </label>
        </div>
        <div class="control-group">
            <label class="checkbox-label">
                <input type="checkbox" id="cb-super-random"> Super losowość (losowe pola przyciągania)
            </label>
        </div>

        <hr>

        <h2>Szablony Ustawień</h2>
        <div class="control-group">
            <label for="templateSelect">Wybierz szablon:</label>
            <select id="templateSelect">
                <!-- Domyślne ładowane z JS -->
            </select>
        </div>
        
        <div class="control-group">
            <label for="templateName">Nazwa nowego szablonu:</label>
            <input type="text" id="templateName" placeholder="dowolna nazwa">
        </div>
        
        <button id="btn-save-template">Zapisz jako szablon</button>
        <button id="btn-delete-template" class="danger-btn">Usuń wybrany</button>

        <hr>

        <div class="results-header">
            <h2>Wynik</h2>
            <label class="checkbox-label">
                <input type="checkbox" id="cb-show-all"> Wyświetl wszystkie
            </label>
        </div>
        
        <div id="results-list">
            <!-- Wyniki generowane dynamicznie przez JS -->
        </div>
        
        <button id="btn-copy-results" class="primary-btn" style="margin-top: 15px;">Kopiuj wyniki do schowka</button>
    </div>

    <script src="game.js"></script>
    <script src="ui.js"></script>
</body>
</html>
