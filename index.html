<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Turbo Losowanie</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
</head>
<body>
    <div id="game-container">
        <div id="names-overlay"></div>
    </div>
    
    <div id="ui-panel">
        <h2>Ustawienia Symulacji</h2>
        
        <div class="control-group">
            <label for="ballCount">Ilość piłeczek:</label>
            <input type="number" id="ballCount" value="100" min="1" max="1000">
        </div>

        <div class="control-group">
            <label for="holeCount">Ilość dołków:</label>
            <input type="number" id="holeCount" value="100" min="1" max="1000">
        </div>
        
        <div class="control-group">
            <label for="ballsPerHole">Pojemność dołka (ilość piłek na dołek):</label>
            <input type="number" id="ballsPerHole" value="1" min="1" max="100">
        </div>

        <div class="control-group">
            <label for="ballNames">Nazwy piłeczek (każda w nowej linii):</label>
            <textarea id="ballNames" rows="5" placeholder="np.&#10;Mściwój&#10;Kunegunda&#10;Kurwiklides"></textarea>
        </div>
        
        <button id="btn-restart" class="primary-btn">Uruchom symulację</button>

        <hr>

        <h2>Ustawienia Magicznych Dołków</h2>
        <div class="control-group">
            <label class="checkbox-label" title="Przełączyć możesz również podczas trwającej jeszcze symulacji">
                <input type="checkbox" id="cb-magnet" checked> Włącz przyciąganie dołków
            </label>
        </div>
        <div class="control-group">
            <label class="checkbox-label" title="Przełączyć możesz również podczas trwającej jeszcze symulacji">
                <input type="checkbox" id="cb-super-random"> Super losowość (losowe pola)
            </label>
        </div>
        <div class="control-group">
            <label class="checkbox-label" title="Przełączyć możesz również podczas trwającej jeszcze symulacji">
                <input type="checkbox" id="cb-show-fields"> Wyświetl położenie obszarów kierujących do dołka
            </label>
        </div>

        <hr>

        <h2>Szablony Ustawień</h2>
        <div class="control-group">
            <label for="templateSelect">Wybierz szablon:</label>
            <select id="templateSelect">
                <!-- Domyślne ładowane z JS -->
            </select>
        </div>
        
        <div class="control-group">
            <label for="templateName">Nazwa nowego szablonu:</label>
            <input type="text" id="templateName" placeholder="dowolna nazwa">
        </div>
        
        <button id="btn-save-template">Zapisz jako szablon</button>
        <button id="btn-delete-template" class="danger-btn">Usuń wybrany</button>

        <!-- NOWA SEKCJA: Import / Eksport kodu szablonu -->
        <div style="margin-top: 20px; background: rgba(13, 19, 26, 0.6); padding: 12px; border-radius: 6px; border: 1px dashed rgba(63, 193, 201, 0.5);">
            <button id="btn-generate-code" style="width: 100%; margin-top: 0;">Wygeneruj kod tego szablonu</button>
            <div class="control-group" style="margin-top: 10px; margin-bottom: 0;">
                <textarea id="templateCodeOutput" rows="2" placeholder="Tu pojawi się kod do skopiowania..." readonly style="background-color: #111a24; color: #99FFFF; word-break: break-all; resize: none; outline: none;"></textarea>
            </div>
            
            <hr style="margin: 15px 0; border-color: rgba(63, 193, 201, 0.2);">
            
            <div class="control-group" style="margin-bottom: 10px;">
                <label for="templateCodeInput" style="color: #99FFFF; font-weight: bold;">Wgraj szablon z kodu:</label>
                <textarea id="templateCodeInput" rows="2" placeholder="Wklej kod od innego gracza..." style="word-break: break-all; resize: none;"></textarea>
            </div>
            <button id="btn-load-code" class="primary-btn" style="width: 100%; margin-top: 0; padding: 8px;">Wczytaj z kodu</button>
        </div>

        <hr>

        <div class="results-header">
            <h2>Wynik</h2>
            <label class="checkbox-label">
                <input type="checkbox" id="cb-show-all"> Wyświetl wszystkie
            </label>
        </div>
        
        <div id="results-list">
            <!-- Wyniki generowane dynamicznie przez JS -->
        </div>
        
        <button id="btn-copy-results" class="primary-btn" style="margin-top: 15px;">Kopiuj wyniki do schowka</button>
    </div>

    <script src="game.js"></script>
    <script src="ui.js"></script>
</body>
</html>
